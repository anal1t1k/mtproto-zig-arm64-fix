
name: Build patched MTProxy for Keenetic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source v1.15.4
        shell: bash
        run: |
          mkdir source
          curl -fL https://github.com/sleep3r/mtproto.zig/archive/refs/tags/v1.15.4.tar.gz -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source

      - name: Patch child process environment
        working-directory: source
        shell: bash
        run: |
          file=src/proxy/child_process.zig

          grep -F 'const argv = try allocator.alloc([]const u8, options.argv.len + 2);' "$file"
          sed -i 's|options.argv.len + 2|options.argv.len + 3|' "$file"
          sed -i '/argv\[1\] = "--default-signal=TERM,INT,HUP,USR1";/a\    argv[2] = "PATH=/opt/bin:/opt/sbin:/opt/usr/bin:/opt/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin";' "$file"
          sed -i 's|@memcpy(argv\[2\.\.\], options.argv);|@memcpy(argv[3..], options.argv);|' "$file"

          echo "=== Verify child process patch ==="
          grep -n -E 'allocator.alloc|argv\[[123]\]|@memcpy' "$file"

      - name: Patch HTTP fetch environment
        working-directory: source
        shell: bash
        run: |
          file=src/proxy/http_fetch.zig
          old='var io_instance: std.Io.Threaded = .init(std.heap.page_allocator, .{});'
          new='var io_instance: std.Io.Threaded = .init(std.heap.page_allocator, .{ .environ = std.Io.Threaded.global_single_threaded.environ.process_environ });'

          count=$(grep -F -c "$old" "$file" || true)
          if [ "$count" -ne 2 ]; then
            echo "Expected 2 matching initializers, found $count"
            exit 1
          fi

          sed -i "s|$old|$new|g" "$file"

          echo "=== Verify HTTP fetch patch ==="
          grep -n 'global_single_threaded.environ.process_environ' "$file"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ARM64 Linux binary
        working-directory: source
        shell: bash
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux -Dcpu=generic

      - name: Prepare artifact
        working-directory: source
        shell: bash
        run: |
          test -f zig-out/bin/mtproto-proxy
          mkdir -p ../artifact
          cp zig-out/bin/mtproto-proxy ../artifact/mtproto-proxy-linux-aarch64
          cd ../artifact
          sha256sum mtproto-proxy-linux-aarch64 > SHA256SUMS.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-zig-keenetic-arm64
          path: artifact/
          if-no-files-found: error

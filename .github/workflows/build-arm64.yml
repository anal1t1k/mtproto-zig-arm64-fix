```yaml
name: Build patched MTProxy for Keenetic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source v1.15.4
        shell: bash
        run: |
          mkdir source
          curl -fL \
            https://github.com/sleep3r/mtproto.zig/archive/refs/tags/v1.15.4.tar.gz \
            -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source

      - name: Patch env path
        working-directory: source
        shell: bash
        run: |
          grep -n '"/usr/bin/env"' src/proxy/child_process.zig
          sed -i 's|"/usr/bin/env"|"/opt/bin/env"|' src/proxy/child_process.zig
          grep -n '"/opt/bin/env"' src/proxy/child_process.zig

      - name: Patch child process environment
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/proxy/http_fetch.zig")
          source = path.read_text()

          old = 'var io_instance: std.Io.Threaded = .init(std.heap.page_allocator, .{});'
          new = 'var io_instance: std.Io.Threaded = .init(std.heap.page_allocator, .{ .environ = std.Io.Threaded.global_single_threaded.environ.process_environ });'

          count = source.count(old)
          if count != 2:
              raise SystemExit(
                  f"Expected exactly 2 matching initializers, found {count}; build aborted"
              )

          path.write_text(source.replace(old, new))

          updated = path.read_text()
          if updated.count(new) != 2:
              raise SystemExit("Patch verification failed")

          print("Patched both Threaded initializers:")
          for number, line in enumerate(updated.splitlines(), 1):
              if new in line:
                  print(f"{number}: {line}")
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ARM64 Linux binary
        working-directory: source
        run: zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux -Dcpu=generic

      - name: Prepare artifact
        working-directory: source
        shell: bash
        run: |
          test -f zig-out/bin/mtproto-proxy
          mkdir -p ../artifact
          cp zig-out/bin/mtproto-proxy ../artifact/mtproto-proxy-linux-aarch64
          cd ../artifact
          sha256sum mtproto-proxy-linux-aarch64 > SHA256SUMS.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-zig-keenetic-arm64
          path: artifact/
          if-no-files-found: error
```

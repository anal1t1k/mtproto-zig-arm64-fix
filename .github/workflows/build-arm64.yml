
name: Build patched MTProxy for Keenetic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source v1.15.4
        shell: bash
        run: |
          mkdir source
          curl -fL https://github.com/sleep3r/mtproto.zig/archive/refs/tags/v1.15.4.tar.gz -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source

      - name: Patch curl to absolute path
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/proxy/http_fetch.zig")
          s = p.read_text()
          old = '"curl"'
          count = s.count(old)

          if count != 2:
              raise SystemExit(f"Expected 2 curl command strings, found {count}")

          s = s.replace(old, '"/opt/bin/curl"')
          p.write_text(s)

          print("Patched curl command strings:", count)
          for i, line in enumerate(s.splitlines(), 1):
              if '"/opt/bin/curl"' in line:
                  print(f"{i}: {line.strip()}")
          PY

      - name: Patch child process environment
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/proxy/child_process.zig")
          s = p.read_text()

          old = 'const argv = try allocator.alloc([]const u8, options.argv.len + 2);'
          new = 'const argv = try allocator.alloc([]const u8, options.argv.len + 3);'

          if s.count(old) != 1:
              raise SystemExit("Could not locate argv allocation")

          s = s.replace(old, new)
          old = 'argv[1] = "--default-signal=TERM,INT,HUP,USR1";'
          new = old + '\n    argv[2] = "PATH=/opt/bin:/opt/sbin:/opt/usr/bin:/opt/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin";'

          if s.count(old) != 1:
              raise SystemExit("Could not locate env option")

          s = s.replace(old, new)
          old = '@memcpy(argv[2..], options.argv);'
          new = '@memcpy(argv[3..], options.argv);'

          if s.count(old) != 1:
              raise SystemExit("Could not locate argv copy")

          s = s.replace(old, new)
          p.write_text(s)
          print("Patched child process PATH")
          PY

          grep -n -E 'allocator.alloc|argv\\[[123]\\]|@memcpy' src/proxy/child_process.zig

      - name: Patch HTTP fetch environment
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/proxy/http_fetch.zig")
          s = p.read_text()
          old = 'var io_instance: std.Io.Threaded = .init(std.heap.page_allocator, .{});'
          new = 'var io_instance: std.Io.Threaded = .init(std.heap.page_allocator, .{ .environ = std.Io.Threaded.global_single_threaded.environ.process_environ });'

          if s.count(old) != 2:
              raise SystemExit(f"Expected 2 IO initializers, found {s.count(old)}")

          p.write_text(s.replace(old, new))
          print("Patched both HTTP fetch IO initializers")
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ARM64 Linux binary
        working-directory: source
        shell: bash
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux -Dcpu=generic

      - name: Prepare artifact
        working-directory: source
        shell: bash
        run: |
          test -f zig-out/bin/mtproto-proxy
          mkdir -p ../artifact
          cp zig-out/bin/mtproto-proxy ../artifact/mtproto-proxy-linux-aarch64
          cd ../artifact
          sha256sum mtproto-proxy-linux-aarch64 > SHA256SUMS.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-zig-keenetic-arm64
          path: artifact/
          if-no-files-found: error

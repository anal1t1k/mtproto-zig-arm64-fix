
name: Build patched MTProxy for Keenetic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source v1.15.4
        shell: bash
        run: |
          mkdir source
          curl -fL \
            https://github.com/sleep3r/mtproto.zig/archive/refs/tags/v1.15.4.tar.gz \
            -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source

      - name: Patch env path
        working-directory: source
        shell: bash
        run: |
          grep -n '"/usr/bin/env"' src/proxy/child_process.zig
          sed -i 's|"/usr/bin/env"|"/opt/bin/env"|' src/proxy/child_process.zig
          grep -n '"/opt/bin/env"' src/proxy/child_process.zig

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ARM64 Linux binary
        working-directory: source
        run: zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux -Dcpu=generic

      - name: Prepare artifact
        working-directory: source
        shell: bash
        run: |
          test -f zig-out/bin/mtproto-proxy
          mkdir -p ../artifact
          cp zig-out/bin/mtproto-proxy ../artifact/mtproto-proxy-linux-aarch64
          cd ../artifact
          sha256sum mtproto-proxy-linux-aarch64 > SHA256SUMS.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-zig-keenetic-arm64
          path: artifact/
          if-no-files-found: error
